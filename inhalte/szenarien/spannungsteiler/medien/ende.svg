<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="en-t">
<title id="en-t">Geschafft: Die Platine auf dem Labortisch leuchtet, die grüne Leuchtdiode brennt, und das Anzeigemodul zeigt die Temperatur mit einem Thermometer und einem Haken. Lichtpunkte und Funken feiern den Abschluss.</title>
