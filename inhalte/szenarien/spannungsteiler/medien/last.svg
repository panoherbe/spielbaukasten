<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="la-t">
<title id="la-t">Auf dem Labortisch liegt die Platine mit den Widerständen R1 und R2. Ein Kabel mit Klemme verbindet jetzt ein zusätzliches Anzeigemodul parallel zu R2. Ein Messgerät daneben zeigt ein Fragezeichen: Was geschieht mit U2?</title>
<!-- Spielbaukasten · Bild: Panagiotis Herbe · CC BY 4.0 -->
<defs>
<linearGradient id="la-wa" x2="0" y2="1"><stop offset="0" stop-color="#0f2f42"/><stop offset="1" stop-color="#0a1d2a"/></linearGradient>
<radialGradient id="la-lp" cx=".42" cy=".2" r=".7"><stop offset="0" stop-color="#ffe7a8" stop-opacity=".38"/><stop offset=".6" stop-color="#ffe7a8" stop-opacity=".06"/><stop offset="1" stop-color="#ffe7a8" stop-opacity="0"/></radialGradient>
<linearGradient id="la-ti" x2="0" y2="1"><stop offset="0" stop-color="#8a6a48"/><stop offset="1" stop-color="#5b4330"/></linearGradient>
<linearGradient id="la-pcb" x2="1" y2="1"><stop offset="0" stop-color="#17615a"/><stop offset="1" stop-color="#0b3936"/></linearGradient>
<pattern id="la-pd" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="1" fill="#fff" fill-opacity=".08"/></pattern>
<linearGradient id="la-wd" x2="0" y2="1"><stop offset="0" stop-color="#f1dfb8"/><stop offset=".5" stop-color="#d9bf8c"/><stop offset="1" stop-color="#b89a62"/></linearGradient>
<linearGradient id="la-ch" x2="1" y2="1"><stop offset="0" stop-color="#3a3f48"/><stop offset="1" stop-color="#15181d"/></linearGradient>
<linearGradient id="la-ge" x2="0" y2="1"><stop offset="0" stop-color="#ffcf3f"/><stop offset="1" stop-color="#e09a00"/></linearGradient>
<linearGradient id="la-mo" x2="0" y2="1"><stop offset="0" stop-color="#4a5562"/><stop offset="1" stop-color="#252c35"/></linearGradient>
<filter id="la-gl" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="480"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="la-sw" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="480"><feGaussianBlur stdDeviation="8"/></filter>
<style>.la-s{font-family:system-ui,sans-serif;font-weight:700}.la-m{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700}</style>
</defs>
<rect width="960" height="480" fill="url(#la-wa)"/>
<path d="M0 60H960M0 150H960" stroke="#fff" stroke-opacity=".04" stroke-width="2"/>
<path d="M80 0V290M240 0V290M400 0V290M560 0V290M720 0V290M880 0V290" stroke="#fff" stroke-opacity=".03" stroke-width="2"/>
<!-- Lampe -->
<path d="M300 0V40" stroke="#2b3440" stroke-width="6"/><path d="M262 40H338L322 70H278Z" fill="#2b3440"/><ellipse cx="300" cy="70" rx="24" ry="6" fill="#fff4cc"/>
<rect width="960" height="480" fill="url(#la-lp)"/>
<!-- Tisch -->
<path d="M0 290H960V480H0Z" fill="url(#la-ti)"/><path d="M0 290H960" stroke="#b08a60" stroke-width="5"/>
<path d="M0 330C200 322 420 340 960 326M0 392C260 384 520 404 960 388M0 446C300 440 560 456 960 444" stroke="#4a3626" stroke-opacity=".35" stroke-width="3" fill="none"/>
<!-- Platine -->
<rect x="96" y="132" width="420" height="250" rx="18" fill="#000" opacity=".45" filter="url(#la-sw)" transform="translate(8 14)"/>
<rect x="90" y="124" width="420" height="250" rx="18" fill="url(#la-pcb)" stroke="#2a8a7c" stroke-width="3"/>
<rect x="90" y="124" width="420" height="250" rx="18" fill="url(#la-pd)"/>
<path d="M170 170H300V188M300 312V340H170V300M300 250H400" stroke="#d9a441" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 250H400" stroke="#ffcf6b" stroke-width="12" opacity=".4" filter="url(#la-gl)"/>
<!-- Batterie -->
<rect x="132" y="190" width="70" height="110" rx="10" fill="#2b3440"/><rect x="140" y="198" width="54" height="94" rx="6" fill="url(#la-ge)"/><rect x="152" y="182" width="30" height="10" rx="3" fill="#aab6bf"/>
<path d="M159 222h16M167 214v16M159 274h16" stroke="#2b3440" stroke-width="4" stroke-linecap="round"/>
<!-- Widerstände -->
<g transform="translate(300 214) rotate(90)"><path d="M-30 0H30" stroke="#c9d2d8" stroke-width="3"/><rect x="-24" y="-11" width="48" height="22" rx="10" fill="url(#la-wd)"/><rect x="-14" y="-10" width="4" height="20" fill="#8a4b2a"/><rect x="-6" y="-10" width="4" height="20" fill="#1d1d1d"/><rect x="2" y="-10" width="4" height="20" fill="#e0402c"/><rect x="10" y="-10" width="4" height="20" fill="#d4a640"/></g>
<g transform="translate(300 286) rotate(90)"><path d="M-30 0H30" stroke="#c9d2d8" stroke-width="3"/><rect x="-24" y="-11" width="48" height="22" rx="10" fill="url(#la-wd)"/><rect x="-14" y="-10" width="4" height="20" fill="#e0402c"/><rect x="-6" y="-10" width="4" height="20" fill="#e0402c"/><rect x="2" y="-10" width="4" height="20" fill="#e0402c"/><rect x="10" y="-10" width="4" height="20" fill="#d4a640"/></g>
<text x="262" y="222" font-size="24" fill="#eaf3ff" class="la-m" text-anchor="middle">R<tspan font-size="16" dy="6">1</tspan></text>
<text x="262" y="294" font-size="24" fill="#5ee0a3" class="la-m" text-anchor="middle">R<tspan font-size="16" dy="6">2</tspan></text>
<circle cx="300" cy="250" r="7" fill="#0b2a28" stroke="#e8b84a" stroke-width="3"/>
<!-- Mikrocontroller -->
<rect x="390" y="196" width="96" height="108" rx="8" fill="url(#la-ch)"/><path d="M394 204h88" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
<path d="M404 196v-10M424 196v-10M444 196v-10M464 196v-10M404 304v10M424 304v10M444 304v10M464 304v10" stroke="#aab6bf" stroke-width="5"/>
<text x="438" y="262" font-size="26" fill="#cfd8de" class="la-m" text-anchor="middle">µC</text>
<!-- Neues Kabel mit Klemme parallel zu R2 -->
<path d="M300 250C310 110 570 100 610 230" stroke="#c0392b" stroke-width="9" fill="none" stroke-linecap="round"/>
<path d="M300 340C360 420 560 410 620 330" stroke="#1d1d1d" stroke-width="9" fill="none" stroke-linecap="round"/>
<path d="M300 250C310 110 570 100 610 230" stroke="#ff8a7a" stroke-width="2.5" fill="none" opacity=".6" stroke-linecap="round"/>
<g transform="translate(296 250) rotate(-62)"><rect x="-6" y="-9" width="34" height="18" rx="5" fill="#d64535"/><path d="M-6 -6l-12 -3M-6 6l-12 3" stroke="#c9d2d8" stroke-width="4" stroke-linecap="round"/></g>
<g transform="translate(300 342) rotate(60)"><rect x="-6" y="-9" width="34" height="18" rx="5" fill="#2b2f36"/><path d="M-6 -6l-12 -3M-6 6l-12 3" stroke="#c9d2d8" stroke-width="4" stroke-linecap="round"/></g>
<circle cx="300" cy="250" r="22" fill="#ffd25a" opacity=".35" filter="url(#la-gl)"/>
<!-- Anzeigemodul = Last -->
<rect x="566" y="208" width="170" height="140" rx="16" fill="#000" opacity=".4" filter="url(#la-sw)" transform="translate(6 12)"/>
<rect x="566" y="208" width="170" height="140" rx="16" fill="url(#la-mo)" stroke="#6b7785" stroke-width="3"/>
<rect x="584" y="226" width="134" height="64" rx="8" fill="#0b1621" stroke="#2f6f9f" stroke-width="2"/>
<path d="M598 266l18-14 16 10 18-20 18 12 18-8" stroke="#6cc4ff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
<text x="651" y="324" font-size="22" fill="#eaf3ff" class="la-m" text-anchor="middle">R<tspan font-size="15" dy="6">L</tspan></text>
<circle cx="600" cy="326" r="6" fill="#ff5a3c"/><circle cx="702" cy="326" r="6" fill="#2b2f36" stroke="#8a96a3" stroke-width="2"/>
<!-- Messgerät -->
<g transform="translate(790 150)"><rect x="6" y="14" width="140" height="210" rx="22" fill="#000" opacity=".4" filter="url(#la-sw)"/>
<rect width="140" height="210" rx="22" fill="url(#la-ge)" stroke="#a86f00" stroke-width="3"/>
<rect x="16" y="18" width="108" height="64" rx="10" fill="#c8e6c9" stroke="#2b3440" stroke-width="4"/>
<text x="70" y="70" font-size="48" fill="#1b2a1f" class="la-s" text-anchor="middle">?</text>
<circle cx="70" cy="136" r="34" fill="#2b3440"/><circle cx="70" cy="136" r="24" fill="#3a4450" stroke="#55606b" stroke-width="3"/><path d="M70 136l14-14" stroke="#eef3f6" stroke-width="5" stroke-linecap="round"/>
<circle cx="40" cy="190" r="8" fill="#c0392b"/><circle cx="100" cy="190" r="8" fill="#1d1d1d"/>
<text x="70" y="108" font-size="15" fill="#3a2a00" class="la-s" text-anchor="middle">V</text></g>
<g transform="translate(860 120)"><circle r="30" fill="#ffd25a" opacity=".3" filter="url(#la-gl)"/><circle r="22" fill="#0b2140" stroke="#ffd25a" stroke-width="4"/><text y="10" font-size="28" fill="#ffd25a" class="la-m" text-anchor="middle">U<tspan font-size="17" dy="6">2</tspan></text></g>
</svg>
