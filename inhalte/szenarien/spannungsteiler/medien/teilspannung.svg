<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="tv-t">
<title id="tv-t">Blaupause zur Teilspannung: Derselbe Strom I fließt durch R1 und R2. Ein Balken rechts teilt die Quellenspannung U in die Teile U1 über R1 und U2 über R2; der Wert von U2 ist mit einem Fragezeichen offen.</title>
<!-- Spielbaukasten · Bild: Panagiotis Herbe · CC BY 4.0 -->
<defs>
<linearGradient id="tv-bp" x2="0" y2="1"><stop offset="0" stop-color="#103154"/><stop offset="1" stop-color="#0a1b31"/></linearGradient>
<radialGradient id="tv-bh" cx=".4" cy=".45" r=".6"><stop offset="0" stop-color="#2a6aa8" stop-opacity=".45"/><stop offset="1" stop-color="#2a6aa8" stop-opacity="0"/></radialGradient>
<pattern id="tv-r1" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#9cccff" stroke-opacity=".07"/></pattern>
<pattern id="tv-r2" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#9cccff" stroke-opacity=".15"/></pattern>
<filter id="tv-gl" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="480"><feGaussianBlur stdDeviation="4"/></filter>
<style>text{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;paint-order:stroke;stroke:#0a1b31;stroke-width:6px;stroke-linejoin:round}</style>
<path id="tv-dr" d="M180 90H440V130M440 220V260M440 350V400H180V290M180 200V90"/>
</defs>
<rect width="960" height="480" fill="url(#tv-bp)"/><rect width="960" height="480" fill="url(#tv-bh)"/><rect width="960" height="480" fill="url(#tv-r1)"/><rect width="960" height="480" fill="url(#tv-r2)"/>
<rect x="14" y="14" width="932" height="452" rx="14" fill="none" stroke="#9cccff" stroke-opacity=".3" stroke-width="2"/>
<path d="M14 44V14h30M916 14h30v30M946 436v30h-30M44 466H14v-30" fill="none" stroke="#9cccff" stroke-opacity=".7" stroke-width="3"/>
<use href="#tv-dr" stroke="#6fb6ff" stroke-width="14" opacity=".4" filter="url(#tv-gl)" fill="none"/>
<use href="#tv-dr" stroke="#eaf3ff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="180" cy="245" r="40" fill="#0b2140" stroke="#eaf3ff" stroke-width="6"/><path d="M180 205V285" stroke="#eaf3ff" stroke-width="6"/>
<path d="M104 205V275" stroke="#ff7a59" stroke-width="5" stroke-linecap="round"/><path d="M104 293l11-20h-22z" fill="#ff7a59"/>
<text x="76" y="257" font-size="38" fill="#ff7a59" text-anchor="middle">U</text>
<!-- Strom I -->
<g filter="url(#tv-gl)" opacity=".8"><path d="M250 90H350" stroke="#ffd25a" stroke-width="10"/></g>
<path d="M250 90H342" stroke="#ffd25a" stroke-width="6" stroke-linecap="round"/><path d="M362 90l-22 12v-24z" fill="#ffd25a"/>
<text x="306" y="70" font-size="34" fill="#ffd25a" text-anchor="middle">I</text>
<g fill="#ffd25a"><circle cx="440" cy="245" r="5"/><circle cx="300" cy="400" r="5"/><circle cx="380" cy="400" r="5"/></g>
<!-- R1 und R2 -->
<rect x="420" y="130" width="40" height="90" rx="3" fill="#0b2140" stroke="#6cc4ff" stroke-width="6"/>
<text x="390" y="186" font-size="34" fill="#6cc4ff" text-anchor="middle">R<tspan font-size="22" dy="8">1</tspan></text>
<rect x="420" y="260" width="40" height="90" rx="3" fill="#0b2140" stroke="#5ee0a3" stroke-width="6"/>
<text x="390" y="316" font-size="34" fill="#5ee0a3" text-anchor="middle">R<tspan font-size="22" dy="8">2</tspan></text>
<circle cx="440" cy="240" r="9" fill="#ffd25a"/>
<path d="M500 136V206" stroke="#6cc4ff" stroke-width="5" stroke-linecap="round"/><path d="M500 222l10-18h-20z" fill="#6cc4ff"/>
<text x="538" y="190" font-size="32" fill="#6cc4ff" text-anchor="middle">U<tspan font-size="21" dy="8">1</tspan></text>
<path d="M500 266V336" stroke="#5ee0a3" stroke-width="5" stroke-linecap="round"/><path d="M500 352l10-18h-20z" fill="#5ee0a3"/>
<text x="538" y="320" font-size="32" fill="#5ee0a3" text-anchor="middle">U<tspan font-size="21" dy="8">2</tspan></text>
<!-- Teilungsbalken -->
<path d="M600 90H700M600 400H700" stroke="#9cccff" stroke-opacity=".5" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="700" y="90" width="90" height="310" rx="12" fill="#0b223f" stroke="#9cccff" stroke-width="4"/>
<rect x="708" y="98" width="74" height="142" rx="7" fill="#6cc4ff" fill-opacity=".3" stroke="#6cc4ff" stroke-width="3"/>
<rect x="708" y="248" width="74" height="144" rx="7" fill="#5ee0a3" fill-opacity=".3" stroke="#5ee0a3" stroke-width="3"/>
<text x="745" y="182" font-size="32" fill="#eaf3ff" text-anchor="middle">U<tspan font-size="21" dy="8">1</tspan></text>
<text x="745" y="333" font-size="32" fill="#eaf3ff" text-anchor="middle">U<tspan font-size="21" dy="8">2</tspan></text>
<path d="M830 98V392" stroke="#ff7a59" stroke-width="5" stroke-linecap="round"/><path d="M830 98l-9 14M830 98l9 14M830 392l-9-14M830 392l9-14" stroke="#ff7a59" stroke-width="5" stroke-linecap="round"/>
<text x="868" y="257" font-size="38" fill="#ff7a59" text-anchor="middle">U</text>
<circle cx="610" cy="320" r="34" fill="#0b2140" stroke="#ffd25a" stroke-width="4"/>
<text x="610" y="336" font-size="44" fill="#ffd25a" text-anchor="middle">?</text>
<path d="M644 320H700" stroke="#ffd25a" stroke-width="3" stroke-dasharray="5 6"/>
</svg>
