# Nachweis-Messung: App, Chrome headless und ein Messlauf (Last, Browser, Barrierefreiheit, Offline-Fassung).
#   docker compose -p spielbaukasten-nachweis -f compose.nachweis.yaml up --build --abort-on-container-exit --exit-code-from messung
#   docker compose -p spielbaukasten-nachweis -f compose.nachweis.yaml down -v
services:
  # nicht „app“ nennen: .app ist eine HSTS-Top-Level-Domain, Chrome erzwingt dafür https
  spielbaukasten:
    build: .
    environment:
      SBK_LEHRENDE_SCHLUESSEL: nachweis
      SBK_DEMO_KURSCODE: DEMO
      SBK_BASIS_URL: http://spielbaukasten:8080
    tmpfs:
      - /daten:mode=1777

  browser:
    image: chromedp/headless-shell:latest
    shm_size: 1gb
    volumes:
      - export:/export

  messung:
    image: node:24-alpine
    network_mode: "service:browser"
    working_dir: /app
    environment:
      APP_URL: http://spielbaukasten:8080
      NODE_NO_WARNINGS: "1"
    volumes:
      - .:/app
      - export:/export
    depends_on:
      spielbaukasten:
        condition: service_healthy
      browser:
        condition: service_started
    command: ["node", "test/e2e/nachweis.js"]

volumes:
  export:
