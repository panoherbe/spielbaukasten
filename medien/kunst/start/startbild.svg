<title id="sb-t">Die Spielwelt am Morgen: eine Stahl-Fachwerkbrücke über einem Bach, Menschen gehen hinüber, dahinter Campus, Festzelt und ein Laborgebäude mit Messmast. Zwei Stecknadeln markieren die Spielorte Brücke und Labor, vorn steht die Bauleitung mit Helm und Tablet.</title>
