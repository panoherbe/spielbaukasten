<style>/* Gestaltung des Spielbaukastens. Alle Farben, Abstände und Radien sind Variablen (Design-Tokens); ein eigenes

:root {
  --grund: #f4f6f8;
  --flaeche: #ffffff;
  --flaeche-2: #eef2f6;
  --text: #17212b;
  --gedaempft: #55626f;
  --linie: #d5dde5;
  --akzent: #1d5fa8;
  --akzent-text: #ffffff;
  --akzent-hell: #e3eefa;
  --gut: #1e6b45;
  --gut-hell: #e2f3e9;
  --neutral: #7a5b00;
  --neutral-hell: #fbf1d3;
  --schlecht: #a3271f;
  --schlecht-hell: #fbe5e3;
  --fokus: #f2a900;
  --radius: 12px;
  --radius-klein: 8px;
  --schatten: 0 1px 2px rgb(16 24 32 / 0.06), 0 4px 16px rgb(16 24 32 / 0.06);
  --abstand: 16px;
  --schrift: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root {
    --grund: #0f141a;
    --flaeche: #18202a;
    --flaeche-2: #212b37;
    --text: #e8edf2;
    --gedaempft: #a3b0bd;
    --linie: #2e3a47;
    --akzent: #6aa8f0;
    --akzent-text: #0b1520;
    --akzent-hell: #1b2c40;
    --gut: #6fd3a0;
    --gut-hell: #15301f;
    --neutral: #f0c75e;
    --neutral-hell: #33290f;
    --schlecht: #ff8f86;
    --schlecht-hell: #3a1a18;
    --schatten: none;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--grund); color: var(--text); font: 17px/1.55 var(--schrift); }
a { color: var(--akzent); }
h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 12px; }
h2 { font-size: 1.25rem; line-height: 1.3; margin: 0 0 10px; }
h3 { font-size: 1.05rem; margin: 16px 0 8px; }
p { margin: 0 0 12px; }
code, .code { font-family: var(--mono); font-size: 0.92em; }
:focus-visible { outline: 3px solid var(--fokus); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }

.nur-vorlesen { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.sprungmarke { position: absolute; left: -999px; top: 8px; background: var(--flaeche); padding: 8px 12px; border-radius: var(--radius-klein); z-index: 10; }
.sprungmarke:focus { left: 8px; }

.leiste { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 10px var(--abstand); background: var(--flaeche); border-bottom: 1px solid var(--linie); }
.marke { font-weight: 700; color: var(--text); text-decoration: none; }
.marke-zeichen { color: var(--akzent); }
#navigation { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.nav-link { text-decoration: none; padding: 4px 2px; border-bottom: 2px solid transparent; }
.nav-link[aria-current="page"] { border-color: var(--akzent); font-weight: 600; }
.pseudonym { color: var(--gedaempft); font-size: 0.9rem; }

.inhalt { max-width: 760px; margin: 0 auto; padding: 20px var(--abstand) 48px; }
.inhalt.breit { max-width: 1100px; }
.fuss { max-width: 1100px; margin: 0 auto; padding: 16px var(--abstand) 32px; color: var(--gedaempft); font-size: 0.85rem; text-align: center; }

.karte { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius); padding: 20px; box-shadow: var(--schatten); margin-bottom: 16px; }
.karte.schmal { max-width: 520px; margin-left: auto; margin-right: auto; }
.stapel { display: flex; flex-direction: column; gap: 8px; }
.gedaempft { color: var(--gedaempft); font-size: 0.9rem; }

/* Knöpfe: mindestens 44 px hoch, damit sie auf dem Telefon sicher treffen */
.knopf { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 18px; border-radius: var(--radius-klein);
  border: 1px solid var(--linie); background: var(--flaeche-2); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
.knopf:hover { border-color: var(--akzent); }
.knopf-haupt { background: var(--akzent); color: var(--akzent-text); border-color: var(--akzent); }
.knopf-haupt:hover { filter: brightness(1.08); }
.knopf-gefahr { color: var(--schlecht); border-color: var(--schlecht); background: var(--schlecht-hell); }
.knopf-text { background: none; border: none; color: var(--akzent); font: inherit; cursor: pointer; padding: 6px 2px; text-decoration: underline; }
.knopf-klein { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; padding: 4px 10px; border-radius: var(--radius-klein);
  border: 1px solid var(--linie); background: var(--flaeche); color: var(--text); font: inherit; font-size: 0.9rem; cursor: pointer; text-decoration: none; }
.knopf-klein:disabled { opacity: 0.35; cursor: default; }
.knopfreihe { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
[aria-busy="true"] button { pointer-events: none; opacity: 0.7; }

input:not([type="radio"]):not([type="checkbox"]), select { font: inherit; min-height: 44px; padding: 8px 12px; border-radius: var(--radius-klein);
  border: 1px solid var(--linie); background: var(--flaeche); color: var(--text); width: 100%; }
.beschriftung { font-weight: 600; font-size: 0.95rem; }

/* Spiel */
.spiel-kopf { margin-bottom: 14px; }
.spiel-titel { font-weight: 700; font-size: 1.05rem; }
.spiel-stand { display: flex; gap: 16px; color: var(--gedaempft); font-size: 0.9rem; margin: 2px 0 10px; }
.indikatoren { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.indikator { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius-klein); padding: 8px 10px; display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; }
.indikator-name { font-size: 0.85rem; color: var(--gedaempft); }
.indikator-wert { font-weight: 700; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.balken { grid-column: 1 / -1; height: 8px; background: var(--flaeche-2); border-radius: 4px; overflow: hidden; }
.balken-fuellung { display: block; height: 100%; width: 0; border-radius: 4px; transition: width 0.4s ease; }
.balken-fuellung.hoch { background: var(--gut); }
.balken-fuellung.mittel { background: var(--neutral); }
.balken-fuellung.tief { background: var(--schlecht); }

.szene .szenen-titel { font-size: 1.35rem; }
.szenenbild { margin: 0 0 14px; border-radius: var(--radius-klein); overflow: hidden; background: #fff; border: 1px solid var(--linie); }
.szenenbild img { display: block; width: 100%; height: auto; }
.optionen { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.knopf-option { justify-content: flex-start; text-align: left; font-weight: 500; background: var(--akzent-hell); border-color: transparent; padding: 14px 16px; }
.knopf-option:hover { border-color: var(--akzent); }

.aufgabe { margin-top: 16px; border-top: 1px solid var(--linie); padding-top: 16px; }
.frage { font-weight: 500; }
.aufgabe-form { display: flex; flex-direction: column; gap: 10px; }
@media (min-width: 561px) { .aufgabe-form > .knopf-haupt { align-self: flex-start; min-width: 180px; } }
.zahlzeile { display: flex; align-items: center; gap: 10px; }
.zahlfeld { max-width: 220px; font-variant-numeric: tabular-nums; }
.einheit { font-weight: 600; }
.aufgabe-fuss { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-top: 10px; }
.hinweis { margin-top: 10px; padding: 10px 12px; border-radius: var(--radius-klein); background: var(--neutral-hell); }
.rueckmeldung-inline { margin-top: 12px; padding: 10px 12px; border-radius: var(--radius-klein); border-left: 4px solid; }
.rueckmeldung-inline.schlecht { background: var(--schlecht-hell); border-color: var(--schlecht); }
.rueckmeldung-inline.neutral { background: var(--neutral-hell); border-color: var(--neutral); }

fieldset.auswahl { border: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.auswahl-option { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; min-height: 44px; border: 1px solid var(--linie); border-radius: var(--radius-klein); cursor: pointer; }
.auswahl-option input { width: 20px; height: 20px; margin-top: 3px; flex: none; }

.reihe { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.reihe-element { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--linie); border-radius: var(--radius-klein); background: var(--flaeche); }
.reihe-nr { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; border-radius: 50%; background: var(--akzent-hell); font-weight: 700; }
.reihe-knoepfe { display: flex; gap: 4px; }

.rueckmeldung { border-left: 6px solid var(--linie); }
.rueckmeldung.gut { border-left-color: var(--gut); }
.rueckmeldung.neutral { border-left-color: var(--neutral); }
.rueckmeldung.schlecht { border-left-color: var(--schlecht); }
.rueckmeldung-titel { display: flex; align-items: center; gap: 10px; }
.zeichen { display: inline-flex; width: 32px; height: 32px; border-radius: 50%; align-items: center; justify-content: center; font-weight: 800; }
.gut .zeichen { background: var(--gut-hell); color: var(--gut); }
.neutral .zeichen { background: var(--neutral-hell); color: var(--neutral); }
.schlecht .zeichen { background: var(--schlecht-hell); color: var(--schlecht); }
.loesung, .erklaerung { background: var(--flaeche-2); border-radius: var(--radius-klein); padding: 10px 12px; }
.effekte { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.effekte li { padding: 4px 10px; border-radius: 999px; font-size: 0.9rem; font-weight: 600; }
.effekte .plus { background: var(--gut-hell); color: var(--gut); }
.effekte .minus { background: var(--schlecht-hell); color: var(--schlecht); }

.ergebnis-band { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 0.9rem; }
.ergebnis-band.gut { background: var(--gut-hell); color: var(--gut); }
.ergebnis-band.neutral { background: var(--neutral-hell); color: var(--neutral); }
.ergebnis-band.schlecht { background: var(--schlecht-hell); color: var(--schlecht); }
.punkte-gross { font-size: 1.3rem; font-weight: 700; }
.lernziele ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.lernziele li { display: flex; gap: 10px; align-items: baseline; }
.stufe { flex: none; font-size: 0.8rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--flaeche-2); }
.stufe-sicher .stufe { background: var(--gut-hell); color: var(--gut); }
.stufe-mit_hilfe .stufe { background: var(--neutral-hell); color: var(--neutral); }
.stufe-offen .stufe { background: var(--schlecht-hell); color: var(--schlecht); }

/* Übersichten */
.kacheln { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.kachel { display: flex; flex-direction: column; margin: 0; }
.kachel .knopfreihe { margin-top: auto; padding-top: 8px; }
.stand { font-size: 0.9rem; color: var(--gut); font-weight: 600; }
.lizenz { font-size: 0.8rem; color: var(--gedaempft); margin: 10px 0 0; }
.code-gross { font-family: var(--mono); font-size: 1.5rem; letter-spacing: 0.08em; background: var(--flaeche-2); padding: 10px 14px; border-radius: var(--radius-klein); text-align: center; }
details summary { cursor: pointer; font-weight: 600; min-height: 32px; }
details[open] summary { margin-bottom: 12px; }

.tabelle-rahmen { overflow-x: auto; margin-bottom: 16px; background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
caption { text-align: left; font-weight: 700; padding: 12px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--linie); vertical-align: top; }
th { background: var(--flaeche-2); font-size: 0.85rem; }
.kennzahlen { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.kennzahl { margin: 0; padding: 12px; display: flex; flex-direction: column; }
.kennzahl-wert { font-size: 1.4rem; font-weight: 700; }
.kennzahl-name { color: var(--gedaempft); font-size: 0.85rem; }
.filterzeile { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 8px 12px; align-items: center; margin-bottom: 16px; }
.pruefergebnis .gut { color: var(--gut); font-weight: 600; }
.pruefergebnis .schlecht { color: var(--schlecht); font-weight: 600; }
.pruefergebnis .neutral { color: var(--neutral); font-weight: 600; }

.meldung { position: fixed; left: 50%; bottom: 16px; transform: translate(-50%, 140%); max-width: min(92vw, 520px); padding: 12px 16px;
  border-radius: var(--radius-klein); background: var(--text); color: var(--grund); box-shadow: var(--schatten); transition: transform 0.25s ease; z-index: 20; }
.meldung.sichtbar { transform: translate(-50%, 0); }
.meldung-fehler { background: var(--schlecht); color: #fff; }

@media (max-width: 560px) {
  body { font-size: 16px; }
  .karte { padding: 16px; }
  .filterzeile { grid-template-columns: 1fr; }
  .indikatoren { grid-template-columns: repeat(3, 1fr); }
  .indikator { padding: 6px 8px; grid-template-columns: 1fr; }
  .indikator-name { font-size: 0.75rem; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

":{"datei":"medien/fachwerk.svg","alt":"Dreiecksfachwerk: zwei Diagonalen D unter dem Winkel theta zur Horizontalen, unten das Zugband Z, oben greift die Last F an; links ein Festlager, rechts ein Loslager."},"text":"Laut Statik lässt sich das betroffene Feld als **Dreieck** berechnen: zwei Diagonalen unter dem Winkel θ = {theta}° zur Horizontalen, unten das **Zugband**, oben die Last **F = {F} kN** (Menschengruppe und Eigengewicht, charakteristischer Wert). Die Stäbe sind gelenkig verbunden, das Eigengewicht der Stäbe ist in F enthalten.\n\nDer Riss sitzt im Zugband. Um ihn zu bewerten, brauchen Sie zuerst die Kräfte in den Stäben.","optionen":[{"id":"rechnen","text":"Zur Berechnung","ziel":"diagonale"}]},"diagonale":{"typ":"aufgabe","titel":"Kraft in der Diagonale","mechanik":"zahl","frage":"Wie groß ist die Druckkraft in **einer** Diagonale? Geben Sie den Betrag in kN an (F = {F} kN, θ = {theta}°).","einheit":"kN","loesung":"F / (2 * sind(theta))","toleranz_prozent":2,"typische_fehler":[{"formel":"F / (2 * cosd(theta))","rueckmeldung":"Sinus und Kosinus vertauscht? Die Last F ist vertikal; sie wird von den vertikalen Anteilen der Diagonalen getragen."},{"formel":"F / sind(theta)","rueckmeldung":"Es gibt zwei Diagonalen; jede trägt die Hälfte der Last."},{"formel":"F / 2","rueckmeldung":"Die Hälfte der Last stimmt, aber die Diagonale ist geneigt. Die Stabkraft ist größer als ihr vertikaler Anteil."}],"versuche":2,"punkte":10,"lernziel":"LZ1","hinweis":"Schneiden Sie den oberen Knoten frei. Summe der vertikalen Kräfte: Die vertikalen Anteile beider Diagonalen halten F das Gleichgewicht.","rueckmeldung":{"richtig":"Richtig.","falsch":"Zeichnen Sie den oberen Knoten mit allen drei Kräften."},"erklaerung":"Oberer Knoten, vertikal: 2 · D · sin θ = F, also D = F / (2 · sin θ) = {= F / (2 * sind(theta)) : 2} kN (Druck).","weiter":"zugband"},"zugband":{"typ":"aufgabe","titel":"Kraft im Zugband","mechanik":"zahl","frage":"Wie groß ist die Zugkraft Z im Zugband (in kN)?","einheit":"kN","loesung":"F / (2 * tand(theta))","toleranz_prozent":2,"typische_fehler":[{"formel":"F * tand(theta) / 2","rueckmeldung":"Tangens statt Kotangens? Am Auflagerknoten zählt der horizontale Anteil der Diagonale: D · cos θ."},{"formel":"F / (2 * sind(theta))","rueckmeldung":"Das ist die Kraft in der Diagonale. Gesucht ist ihr horizontaler Anteil, den das Zugband aufnimmt."}],"versuche":2,"punkte":10,"lernziel":"LZ1","hinweis":"Schneiden Sie einen unteren Knoten frei. Horizontal hält das Zugband dem horizontalen Anteil der Diagonale das Gleichgewicht.","rueckmeldung":{"richtig":"Richtig. Das Zugband hält die beiden Auflager zusammen.","falsch":"Welcher Anteil der Diagonalkraft wirkt horizontal?"},"erklaerung":"Unterer Knoten, horizontal: Z = D · cos θ = F / (2 · tan θ) = {= F / (2 * tand(theta)) : 2} kN (Zug).","weiter":"spannung"},"spannung":{"typ":"aufgabe","titel":"Spannung am Riss","mechanik":"zahl","frage":"Das Zugband ist ein Flachstahl 40 × 8 mm aus S235 (Streckgrenze f_y = 235 N/mm²). Der Riss geht über die halbe Breite; es bleiben 20 × 8 mm = **160 mm²**.\n\nVereinfachtes Lehrmodell (kein vollständiger Nachweis nach Eurocode 3): Bemessungsspannung σ_Ed = 1,5 · Z / A_netto. Wie groß ist σ_Ed in N/mm²?","einheit":"N/mm²","loesung":"1.5 * F / (2 * tand(theta)) * 1000 / 160","toleranz_prozent":2,"stellen":1,"typische_fehler":[{"formel":"F / (2 * tand(theta)) * 1000 / 160","rueckmeldung":"Der Teilsicherheitsbeiwert 1,5 auf der Lastseite fehlt."},{"formel":"1.5 * F / (2 * tand(theta)) * 1000 / 320","rueckmeldung":"Das ist der ungeschwächte Querschnitt. Am Riss trägt nur der Rest: 160 mm²."},{"formel":"1.5 * F / (2 * sind(theta)) * 1000 / 160","rueckmeldung":"Sie haben die Diagonalkraft eingesetzt; der Riss sitzt im Zugband."}],"versuche":2,"punkte":15,"lernziel":"LZ2","hinweis":"1 kN = 1000 N. Spannung = Kraft / Fläche, mit der Fläche, die am Riss noch trägt.","rueckmeldung":{"richtig":"Richtig.","falsch":"Prüfen Sie Einheit, Fläche und den Faktor 1,5."},"erklaerung":"σ_Ed = 1,5 · {= F / (2 * tand(theta)) : 2} kN · 1000 / 160 mm² = {= 1.5 * F / (2 * tand(theta)) * 1000 / 160 : 1} N/mm². Ausnutzung η = σ_Ed / f_y = {= 1.5 * F / (2 * tand(theta)) * 1000 / 160 / 235 : 2}.","weiter":"nachweis"},"nachweis":{"typ":"verzweigung","regeln":[{"wenn":"1.5 * F / (2 * tand(theta)) * 1000 / 160 \u003c= 235","ziel":"entscheidung_reserve"}],"sonst":"entscheidung_ueberlastet"},"entscheidung_reserve":{"typ":"szene","titel":"Der Nachweis ist erfüllt – und jetzt?","text":"Mit σ_Ed = {= 1.5 * F / (2 * tand(theta)) * 1000 / 160 : 1} N/mm² ≤ 235 N/mm² ist der vereinfachte Nachweis am Restquerschnitt **erfüllt** (η = {= 1.5 * F / (2 * tand(theta)) * 1000 / 160 / 235 : 2}). Der Riss ist trotzdem da. Noch {tage : 0} Tage bis zum Fest, Budget {budget : 0} T€.\n\nWie entscheiden Sie?","optionen":[{"id":"freigeben","text":"Freigeben – die Rechnung zeigt ja Reserve","effekte":{"sicherheit":-30},"bewertung":"schlecht","lernziel":"LZ3","rueckmeldung":"Der Nachweis gilt für den heutigen Rest. Ein Riss in einem Zugglied wächst unter wiederholter Belastung weiter (Ermüdung). Ohne Reparatur und Kontrolle ist eine Freigabe nicht vertretbar.","ziel":"abschluss"},{"id":"auflagen","text":"Bis zur Reparatur nur mit Auflagen öffnen: höchstens 10 Personen gleichzeitig, Riss markieren, tägliche Sichtkontrolle; Reparatur nach dem Fest","effekte":{"sicherheit":10,"budget":-6},"bewertung":"neutral","lernziel":"LZ3","rueckmeldung":"Vertretbar, weil der Nachweis Reserve zeigt und Last und Riss überwacht werden. Am Festtag ist eine Personenbegrenzung aber schwer durchzusetzen; sicherer wäre die Reparatur vorher.","ziel":"abschluss"},{"id":"reparatur","text":"Gesperrt lassen und sofort reparieren: beidseitig aufgeschraubte Laschen über den Riss (2 Tage), danach freigeben","effekte":{"sicherheit":25,"budget":-6,"tage":-2},"bewertung":"gut","lernziel":"LZ3","rueckmeldung":"Gut entschieden: Die Laschen übernehmen die Kraft über den Riss hinweg, die Brücke ist zum Fest wieder voll nutzbar. Der Austausch des Zugbands kann regulär geplant werden.","ziel":"abschluss"}]},"entscheidung_ueberlastet":{"typ":"szene","titel":"Der Nachweis ist nicht erfüllt","text":"Mit σ_Ed = {= 1.5 * F / (2 * tand(theta)) * 1000 / 160 : 1} N/mm² > 235 N/mm² ist der vereinfachte Nachweis am Restquerschnitt **nicht erfüllt** (η = {= 1.5 * F / (2 * tand(theta)) * 1000 / 160 / 235 : 2}). Noch {tage : 0} Tage bis zum Fest, Budget {budget : 0} T€.\n\nWie entscheiden Sie?","optionen":[{"id":"freigeben","text":"Freigeben – die Brücke steht seit Jahren","effekte":{"sicherheit":-40},"bewertung":"schlecht","lernziel":"LZ3","rueckmeldung":"Nicht vertretbar: Unter der angesetzten Last reicht der Restquerschnitt rechnerisch nicht. Dass die Brücke bisher gehalten hat, sagt nichts über die nächste volle Belastung.","ziel":"abschluss"},{"id":"begrenzen","text":"Mit Personenbegrenzung öffnen","effekte":{"sicherheit":-30},"bewertung":"schlecht","lernziel":"LZ3","rueckmeldung":"Eine Begrenzung hilft nur, wenn die reduzierte Last neu nachgewiesen und überwacht wird. Ohne diesen Nachweis bleibt es eine Vermutung.","ziel":"abschluss"},{"id":"reparatur","text":"Gesperrt lassen und sofort reparieren: beidseitig aufgeschraubte Laschen über den Riss (2 Tage), Umleitung bleibt bis dahin","effekte":{"sicherheit":25,"budget":-6,"tage":-2},"bewertung":"gut","lernziel":"LZ3","rueckmeldung":"Richtig: Der Restquerschnitt reicht nicht, also bleibt die Brücke zu, bis die Laschen die Kraft übernehmen.","ziel":"abschluss"}]},"abschluss":{"typ":"verzweigung","regeln":[{"wenn":"sicherheit >= 90","ziel":"ende_erfolg"},{"wenn":"sicherheit >= 50","ziel":"ende_teilerfolg"}],"sonst":"ende_misserfolg"},"ende_erfolg":{"typ":"ende","ergebnis":"erfolg","titel":"Sicher zum Fest","text":"Die Brücke trägt wieder mit voller Reserve, das Fest kann kommen. Sie haben zuerst gesichert, dann systematisch geprüft und nach der Rechnung entschieden. Sicherheit {sicherheit : 0} %, Restbudget {budget : 0} T€."},"ende_teilerfolg":{"typ":"ende","ergebnis":"teilerfolg","titel":"Gut gegangen – diesmal","text":"Es ist nichts passiert, aber nicht jede Entscheidung hatte genug Reserve: entweder war die Brücke ungeprüft offen, oder sie ist nur mit Auflagen in Betrieb. Sicherheit {sicherheit : 0} %. Spielen Sie den Fall noch einmal und achten Sie auf die Reihenfolge Sichern – Prüfen – Entscheiden."},"ende_misserfolg":{"typ":"ende","ergebnis":"misserfolg","titel":"Die Bauaufsicht sperrt die Brücke","text":"Bei der Kontrolle vor dem Fest sperrt die Bauaufsicht die Brücke: Ein gerissenes Zugglied ohne Reparatur und ohne Überwachung ist nicht freizugeben. Sicherheit {sicherheit : 0} %. Die Rechnung war der halbe Weg; die Verantwortung für die Entscheidung bleibt."}}}</script>
